<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Astro_Bytes Crew Health Portal — a space mission health monitoring prototype."
  >

  <title>Sign In | Astro_Bytes Crew Health Portal</title>

  <link
    rel="icon"
    type="image/png"
    href="images/astro_bytes_logo.png"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="login-page">
    <!-- Native radio controls will support visual focus through CSS. -->
    <fieldset class="scene-controls">
      <legend>Visual focus</legend>

      <div class="scene-controls__options">
        <input
          type="radio"
          id="focus-station"
          name="visual-focus"
          value="station"
          checked
        >
        <label for="focus-station">Space station</label>

        <input
          type="radio"
          id="focus-background"
          name="visual-focus"
          value="background"
        >
        <label for="focus-background">Space background</label>
      </div>
    </fieldset>

    <!-- Decorative layers remain separate for blending and animation. -->
    <div class="space-scene" aria-hidden="true">
        <video
        class="space-scene__background"
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
        poster="images/background.png"
        >
            <source src="videos/space-background.mp4" type="video/mp4">
        </video>

      <div class="space-scene__station-layer">
        <img
          class="space-scene__station"
          src="images/Estacao_Espacial.png"
          alt=""
        >
      </div>
    </div>

    <!-- The login panel will remain sharp in both visual focus modes. -->
    <section class="login-panel" aria-labelledby="login-title">
      <header class="login-panel__header">
        <h1 id="login-title">Crew Health Portal</h1>
        <p id="login-description">
          Sign in to access your mission health records.
        </p>
      </header>

      <!-- Authentication will be connected in a later implementation step. -->
      <form
        id="login-form"
        class="login-form"
        method="post"
        aria-describedby="login-description prototype-notice"
      >
        <div class="form-field">
          <label for="email">Email address</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="astronaut@example.com"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
          >
        </div>

        <div class="form-field">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <!-- Reserved for future authentication feedback. -->
        <p
          id="login-message"
          class="login-form__message"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></p>

        <button
          class="login-form__submit"
          type="submit"
          disabled
          aria-describedby="prototype-notice"
        >
          Sign In
        </button>
        <a class="demo-link" href="health.html">
          Explore Demonstration
        </a>

        <p id="prototype-notice" class="prototype-notice">
          Interface prototype. Sign-in is not available yet.
          Do not enter real credentials.
        </p>
      </form>

      <footer class="team-credit">
        <p class="team-credit__label">Created by</p>

        <img
          class="team-credit__logo"
          src="images/astro_bytes_logo_nome.png"
          alt="Astro_Bytes"
        >
      </footer>
    </section>

    <footer class="project-credit">
      <img
        class="project-credit__logo"
        src="images/Logo_Nasa_Transparente.png"
        alt="NASA"
      >

      <p class="project-credit__text">
        NASA Space Apps Challenge project.
        Independent prototype, not affiliated with or endorsed by NASA.
      </p>
    </footer>
  </main>
</body>
</html>
